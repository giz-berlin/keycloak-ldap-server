[package]
name = "zammad-ldap"
description = "Zammad LDAP server — synchronizes users from Keycloak to provide Zammad-compatible LDAP attribute sets, skipping disabled users"
homepage = "https://gitlab.com/leonard/marschke/keycloak-ldap-server/-/tree/main/zammad-ldap"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "~1.0.102"
giz-ldap-lib = { path = "../ldap-lib" }
tokio = { version = "1", features = ["io-util"] }
